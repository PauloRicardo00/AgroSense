spring.application.name=backend
agrosense.frontend.origins=${AGROSENSE_FRONTEND_ORIGINS:}
server.address=127.0.0.1
server.servlet.session.timeout=-1s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${AGROSENSE_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false
server.tomcat.max-http-form-post-size=16KB
agrosense.modelo.pasta=${AGROSENSE_MODELO_PASTA:./modelo}
agrosense.mqtt.enabled=${AGROSENSE_MQTT_ENABLED:true}
agrosense.mqtt.broker=${AGROSENSE_MQTT_BROKER:tcp://127.0.0.1:1883}
agrosense.mqtt.topic=${AGROSENSE_MQTT_TOPIC:planta/maquina1/dados}
agrosense.modelo.versao=agrosense-v4/4.2.0
spring.datasource.url=${AGROSENSE_DB_URL:jdbc:postgresql://localhost:5432/agrosense}
spring.datasource.username=${AGROSENSE_DB_USER:agrosense}
spring.datasource.password=${AGROSENSE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
